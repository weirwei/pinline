<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <!-- The title is what shows up as the line in the tab strip (set by divider.js). -->
  <title>────────────────────────────────────────────────────────────</title>
  <!-- Empty SVG: no favicon in the tab row. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'/%3E">
  <meta name="color-scheme" content="light dark">
  <script src="divider.js"></script>
  <script src="panel.js" type="module"></script>
  <style>
    :root {
      --bg: #f7f7f8; --card: #fff; --fg: #1f1f1f; --muted: #6b6b70; --line: #e4e4e7;
      --accent: #0b57d0; --accent-bg: #e8f0fe; --danger: #b3261e; --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1b1d; --card: #26272a; --fg: #e8eaed; --muted: #9aa0a6; --line: #3a3b3f; --accent: #8ab4f8; --accent-bg: #2b3a55; --danger: #f28b82; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); }
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 40px 28px; display: grid; grid-template-columns: 300px 1fr; gap: 24px; }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
    h1 { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
    h2 { font-size: 15px; margin: 0 0 4px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
    .stack { display: grid; gap: 16px; align-content: start; }
    .hint { color: var(--muted); font-size: 12px; margin: 4px 0 12px; }

    /* Space list */
    #spaces { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
    #spaces li { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
    .badge { font-size: 12px; color: var(--accent); padding: 0 10px; }
    .space { width: 100%; display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; text-align: left;
      padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .space:hover { background: var(--bg); }
    .space[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); }
    .space .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
    .space:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .key { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; text-align: center; line-height: 18px; }
    .space .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .space .meta { grid-column: 2; color: var(--muted); font-size: 12px; margin-top: -6px; }

    input, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; min-width: 0; }
    input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    button.btn { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; white-space: nowrap; }
    button.btn:hover:not(:disabled) { border-color: var(--muted); }
    button.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button.btn:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
    button.danger { color: var(--danger); }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > input, .row > select { flex: 1; }
    label.field { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    td { padding: 6px 0; border-bottom: 1px solid var(--line); }
    td:last-child { text-align: right; color: var(--muted); }
    td kbd { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
    tr:last-child td { border-bottom: none; }
    #names td { text-align: left; color: inherit; }
    #names td.kind { width: 34px; color: var(--muted); font-size: 12px; }
    #names input { width: 100%; }
    #names tr.focus input { outline: 2px solid var(--accent); }
    #status { min-height: 1.5em; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="stack">
      <section class="card" aria-labelledby="spaces-title">
        <h1 id="spaces-title">Space</h1>
        <ul id="spaces" aria-label="Space 列表"></ul>
        <form id="new" class="row">
          <input id="new-name" maxlength="40" autocomplete="off" aria-label="新 Space 名称">
          <button class="btn primary" type="submit">新建</button>
        </form>
        <p class="hint">点一下选中（右边可改名 / 删除），点「切换」或双击切过去。键盘：1–9 选中，回车切换。新建会直接切过去。</p>
      </section>
      <div id="status" role="status" aria-live="polite"></div>
    </div>

    <div class="stack">
      <section class="card" aria-labelledby="current-title">
        <h1 id="current-title">选中的 Space</h1>
        <label class="field" for="rename">名称（回车保存）</label>
        <div class="row">
          <input id="rename" maxlength="40" autocomplete="off">
          <button class="btn primary" id="switch" type="button">切换</button>
          <button class="btn danger" id="delete" type="button">删除</button>
        </div>
        <p class="hint" id="current-meta"></p>
      </section>

      <section class="card" aria-labelledby="names-title">
        <h1 id="names-title">Fav / Pin 名称</h1>
        <p class="hint">留空 = 用网页自己的标题。回车保存。</p>
        <p class="hint" id="perm" hidden>
          已加载的网页要显示新名字，需要一次「所有网站」权限（脚本只在你改过名的网站上运行，可随时收回）。没有权限时，名字只在休眠时显示。
          <button class="btn" id="grant" type="button">授权</button>
        </p>
        <table><tbody id="names"></tbody></table>
      </section>

      <section class="card" aria-labelledby="bm-title">
        <h1 id="bm-title">收藏夹</h1>
        <p class="hint">Fav 和 Pin 同步在「其他书签 / Pinline」：在书签管理器里改名、排序、增删书签，这里会跟着变。</p>
        <label class="field" for="folder">从书签文件夹新建 Space（它里面的书签变成 Pin，原文件夹不动）</label>
        <form id="import" class="row">
          <select id="folder"></select>
          <button class="btn" type="submit">导入</button>
        </form>
      </section>

      <section class="card" aria-labelledby="keys-title">
        <h1 id="keys-title">快捷键</h1>
        <table><tbody id="keys"></tbody></table>
        <p class="hint"><button class="btn" id="edit-keys" type="button">去设置快捷键</button></p>
      </section>
    </div>
  </main>
</body>
</html>
