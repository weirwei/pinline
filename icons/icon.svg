<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Store guideline: 96×96 artwork centred in 128×128 with 16 px transparent padding. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#e6452e"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="96" height="96" rx="22" fill="url(#bg)"/>
  <!-- Favs: a row of tiles -->
  <rect x="30" y="30" width="19" height="19" rx="5" fill="#fff"/>
  <rect x="54.5" y="30" width="19" height="19" rx="5" fill="#fff"/>
  <rect x="79" y="30" width="19" height="19" rx="5" fill="#fff"/>
  <!-- Pins: full rows -->
  <rect x="30" y="58" width="68" height="9" rx="4.5" fill="#fff"/>
  <rect x="30" y="73" width="50" height="9" rx="4.5" fill="#fff"/>
  <!-- the divider -->
  <rect x="30" y="91" width="68" height="4" rx="2" fill="#fff" fill-opacity=".55"/>
</svg>
